// android/build.gradle
// Minimal Gradle file for Dependabot POC.
// This is only to show that Dependabot can check Android Gradle dependencies.

buildscript {
    ext {
        kotlinVersion = "1.7.10"
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:7.2.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
